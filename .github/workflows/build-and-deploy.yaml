name: Publish Python 🐍 distribution 📦 to PyPI and TestPyPI

on:
  push:
    branches: ["main"]
    tags: ["v*"]

jobs:
  build-wheels:
    name: Build wheels on ${{ matrix.os }} (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: auto
          # Linux aarch64 (ARM64)
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            manylinux: auto
          # macOS x86_64 (Intel)
          - os: macos-latest
            target: x86_64-apple-darwin
          # macOS aarch64 (Apple Silicon M1/M2/M3/M4)
          - os: macos-latest
            target: aarch64-apple-darwin
          # Windows x86_64 (AMD64)
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set dynamic version from Git
        shell: bash
        run: |
          python3 -c "
          import subprocess, re
          try:
              desc = subprocess.check_output(['git', 'describe', '--tags', '--always', '--long'], text=True).strip()
              m = re.match(r'^v?(\d+)\.(\d+)\.(\d+)(?:-(\d+)-g([0-9a-f]+))?$', desc)
              if m:
                  major, minor, patch, dist, commit = m.groups()
                  if not dist or dist == '0':
                      ver = f'{major}.{minor}.{patch}'
                  else:
                      ver = f'{major}.{minor}.{int(patch)+1}-dev.{dist}'
                  with open('Cargo.toml') as f:
                      c = f.read()
                  with open('Cargo.toml', 'w') as f:
                      f.write(re.sub(r'version = \"[^\"]+\"', f'version = \"{ver}\"', c, count=1))
                  print(f'Using dynamic version: {ver}')
          except Exception as e:
              print(f'Fallback to Cargo.toml version: {e}')
          "

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter
          manylinux: ${{ matrix.manylinux || 'off' }}

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist

  build-sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set dynamic version from Git
        shell: bash
        run: |
          python3 -c "
          import subprocess, re
          try:
              desc = subprocess.check_output(['git', 'describe', '--tags', '--always', '--long'], text=True).strip()
              m = re.match(r'^v?(\d+)\.(\d+)\.(\d+)(?:-(\d+)-g([0-9a-f]+))?$', desc)
              if m:
                  major, minor, patch, dist, commit = m.groups()
                  if not dist or dist == '0':
                      ver = f'{major}.{minor}.{patch}'
                  else:
                      ver = f'{major}.{minor}.{int(patch)+1}-dev.{dist}'
                  with open('Cargo.toml') as f:
                      c = f.read()
                  with open('Cargo.toml', 'w') as f:
                      f.write(re.sub(r'version = \"[^\"]+\"', f'version = \"{ver}\"', c, count=1))
                  print(f'Using dynamic version: {ver}')
          except Exception as e:
              print(f'Fallback to Cargo.toml version: {e}')
          "

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  publish-to-pypi:
    name: Publish Python 🐍 distribution 📦 to PyPI
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/blacksquare
    permissions:
      id-token: write

    steps:
      - uses: astral-sh/setup-uv@v5
      - name: Download all wheels and sdist
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Publish distribution 📦 to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  publish-to-testpypi:
    name: Publish Python 🐍 distribution 📦 to TestPyPI
    if: github.ref == 'refs/heads/main'
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/blacksquare
    permissions:
      id-token: write

    steps:
      - uses: astral-sh/setup-uv@v5
      - name: Download all wheels and sdist
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Publish distribution 📦 to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          skip-existing: true
          verbose: true
