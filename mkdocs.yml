site_name: Blacksquare
site_description: Ultra-fast, intuitive Python package for creating, editing, and solving crossword puzzles backed by Rust.
site_author: Patrick Maher
site_url: https://pmaher86.github.io/blacksquare/
repo_url: https://github.com/pmaher86/blacksquare
repo_name: pmaher86/blacksquare

theme:
  name: material
  language: en
  palette:
    # Light mode
    - scheme: default
      primary: black
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets
  - pymdownx.keys
  - tables
  - attr_list
  - md_in_html
  - def_list
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_root_heading: true
            show_source: true
            heading_level: 2
            docstring_style: google
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            show_signature_annotations: true
            separate_signature: true
            filters:
              - "!^_"

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - User Guide:
      - Grids & Cells: user-guide/grid-and-cells.md
      - Words & Crosses: user-guide/words-and-crosses.md
      - Solving & Auto-Fill: user-guide/filling-and-solving.md
      - Word Lists & Scoring: user-guide/word-lists.md
      - Export & Publishing: user-guide/import-export.md
  - API Reference:
      - Crossword: api/crossword.md
      - Word: api/word.md
      - Cell: api/cell.md
      - WordList: api/word-list.md
      - Types & Symmetry: api/symmetry-and-types.md
