[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "blacksquare"
description = "A package for creating crossword puzzles"
authors = [{ name = "Patrick Maher", email = "pmaher86@gmail.com" }]
readme = "README.md"
dependencies = ["networkx", "numpy", "pandas", "puzpy", "rich"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.10"
dynamic = ["version"]

[project.urls]
Source = "https://github.com/pmaher86/blacksquare"

[project.optional-dependencies]
dev = ["pre-commit", "pytest", "uv", "maturin"]
pdf = ["pypdf", "weasyprint"]

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "blacksquare._blacksquare_rs"
python-source = "src"
include = ["src/blacksquare/*.npz"]
