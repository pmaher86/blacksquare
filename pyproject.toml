[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "blacksquare"
description = "A package for creating crossword puzzles"
authors = [{ name = "Patrick Maher", email = "pmaher86@gmail.com" }]
readme = "README.md"
dependencies = ["numpy", "pandas", "rich"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.10"
dynamic = ["version"]

[project.urls]
Source = "https://github.com/pmaher86/blacksquare"

[project.optional-dependencies]
pdf = ["pypdf", "weasyprint"]

[dependency-groups]
dev = [
    "maturin>=1.0",
    "pre-commit>=3.0",
    "pytest>=8.0",
    "ruff>=0.9.0",
    "ty>=0.0.70",
]
lint = [
    "ruff>=0.9.0",
    "ty>=0.0.70",
]
test = [
    "pytest>=8.0",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.27.0",
]

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "blacksquare._blacksquare_rs"
python-source = "src"

[tool.uv]
exclude-newer = "3 days"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
